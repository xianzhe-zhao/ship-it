name: gunzip and sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gunzip-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gunzip large files
        run: |
          echo "解压 .gz 文件覆盖原文件..."
          find . -name '*.gz' -not -path './.git/*' -print0 | while IFS= read -r -d '' gz; do
            orig="${gz%.gz}"
            echo "  $gz -> $orig"
            gunzip -f "$gz"
          done
          echo "解压完成"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更,跳过"
          else
            git commit -m "Step 9: gunzip large files (auto-sync v5.2.1 clean versions via CI)"
            git push
            echo "已 push 解压后的文件"
          fi
