name: ship-it gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-first:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Resolve base
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: check_spec --git-check (changed specs)
        shell: bash
        run: |
          mkdir -p ci-logs
          BASE="${{ steps.base.outputs.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "$BASE"...HEAD -- 'ship-it/docs/specs/*.md' || true)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "no changed spec; skip check_spec" | tee ci-logs/check_spec.log
            exit 0
          fi
          FAILED=0
          for spec in "${CHANGED[@]}"; do
            echo "== $spec (base=$BASE)" | tee -a ci-logs/check_spec.log
            status=$(grep -m1 '^status:' "$spec" | cut -d: -f2 | tr -d ' "')
            if [ "$status" = "paused" ]; then
              echo "SKIP: spec status=paused (abandoned contract)" | tee -a ci-logs/check_spec.log
              continue
            fi
            python ship-it/scripts/check_spec.py "$spec" --stage spec > ci-logs/spec-out.log 2>&1
            rc=$?
            cat ci-logs/spec-out.log | tee -a ci-logs/check_spec.log
            if [ $rc -ne 0 ]; then
              echo "check_spec failed for $spec (exit $rc)" | tee -a ci-logs/check_spec.log
              FAILED=1
            fi
          done
          exit $FAILED

      - name: check_text
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python ship-it/scripts/check_text.py --root . --allow-missing-git-push 2>&1 | tee ci-logs/check_text.log

      - name: check_docs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python ship-it/scripts/check_docs.py --root . 2>&1 | tee ci-logs/check_docs.log

      - name: tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          set +e
          python -m tests.run_suite 2>&1 | tee ci-logs/tests.log
          rc=${PIPESTATUS[0]}
          # 0=全过 2=有SKIP但无failure/error；其他=真失败
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ship-it-gate-evidence
          path: ci-logs/
          if-no-files-found: warn
